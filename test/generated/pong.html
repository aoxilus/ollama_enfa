<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
            background-color: #000;
        }
    </style>
</head>
<body>
    <canvas id="pongCanvas"></canvas>
    <script>
        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');
        const paddleWidth = 10;
        const paddleHeight = 100;
        const ballRadius = 5;
        const paddleSpeed = 5;
        const ballSpeed = 5;
        const paddle1X = 10;
        const paddle1Y = canvas.height / 2 - paddleHeight / 2;
        const paddle2X = canvas.width - paddleWidth - 10;
        const paddle2Y = canvas.height / 2 - paddleHeight / 2;
        const ballX = canvas.width / 2;
        const ballY = canvas.height / 2;
        let ballDX = ballSpeed;
        let ballDY = ballSpeed;
        let score1 = 0;
        let score2 = 0;

        function drawPaddle(x, y, width, height, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, height);
        }

        function drawBall(x, y, radius, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawScore() {
            ctx.font = '24px Arial';
            ctx.fillStyle = '#fff';
            ctx.fillText(`Player 1: ${score1}`, 10, 30);
            ctx.fillText(`Player 2: ${score2}`, canvas.width - 100, 30);
        }

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawPaddle(paddle1X, paddle1Y, paddleWidth, paddleHeight, '#fff');
            drawPaddle(paddle2X, paddle2Y, paddleWidth, paddleHeight, '#fff');
            drawBall(ballX, ballY, ballRadius, '#fff');

            if (ballX <= 0 || ballX >= canvas.width) {
                ballDX = -ballDX;
            }
            if (ballY <= 0 || ballY >= canvas.height) {
                ballDY = -ballDY;
            }

            if (ballX >= paddle1X && ballX <= paddle1X + paddleWidth && ballY >= paddle1Y && ballY <= paddle1Y + paddleHeight) {
                ballDX = -ballDX;
            }

            if (ballX >= paddle2X && ballX <= paddle2X + paddleWidth && ballY >= paddle2Y && ballY <= paddle2Y + paddleHeight) {
                ballDX = -ballDX;
            }

            ballX += ballDX;
            ballY += ballDY;

            if (ballY <= 0 || ballY >= canvas.height) {
                score1++;
                resetBall();
            }

            if (ballX <= 0 || ballX >= canvas.width) {
                score2++;
                resetBall();
            }

            requestAnimationFrame(update);
        }

        function resetBall() {
            ballX = canvas.width / 2;
            ballY = canvas.height / 2;
            ballDX = ballSpeed;
            ballDY = ballSpeed;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' && paddle1Y > 0) {
                paddle1Y -= paddleSpeed;
            } else if (e.key === 'ArrowDown' && paddle1Y < canvas.height - paddleHeight) {
                paddle1Y += paddleSpeed;
            } else if (e.key === 'ArrowUp' && paddle2Y > 0) {
                paddle2Y -= paddleSpeed;
            } else if (e.key === 'ArrowDown' && paddle2Y < canvas.height - paddleHeight) {
                paddle2Y += paddleSpeed;
            }
        });

        update();
    </script>
</body>
</html>
