<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Example</title>
    <style>
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <form id="myForm">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <span class="error" id="nameError"></span><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <span class="error" id="emailError"></span><br><br>

        <label for="select">Select:</label>
        <select id="select" name="select" required>
            <option value="">Select an option</option>
            <option value="option1">Option 1</option>
            <option value="option2">Option 2</option>
        </select>
        <span class="error" id="selectError"></span><br><br>

        <label for="textarea">Textarea:</label>
        <textarea id="textarea" name="textarea" required></textarea>
        <span class="error" id="textareaError"></span><br><br>

        <input type="submit" value="Submit">
    </form>

    <script>
        document.getElementById('myForm').addEventListener('submit', function(event) {
            event.preventDefault();

            var name = document.getElementById('name').value;
            var email = document.getElementById('email').value;
            var select = document.getElementById('select').value;
            var textarea = document.getElementById('textarea').value;

            var nameError = document.getElementById('nameError');
            var emailError = document.getElementById('emailError');
            var selectError = document.getElementById('selectError');
            var textareaError = document.getElementById('textareaError');

            if (name === '') {
                nameError.textContent = 'Name is required';
                return;
            }

            if (email === '') {
                emailError.textContent = 'Email is required';
                return;
            }

            if (select === '') {
                selectError.textContent = 'Select an option';
                return;
            }

            if (textarea === '') {
                textareaError.textContent = 'Textarea is required';
                return;
            }

            alert('Form submitted successfully!');
        });
    </script>
</body>
</html>
